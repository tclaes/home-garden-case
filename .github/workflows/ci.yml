name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CI: 'true'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, test, build, typecheck
        run: npx nx run-many -t lint test build typecheck
